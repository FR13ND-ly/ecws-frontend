<section class="edition" *ngIf="state$ | async as state">
    <header class="edition__header">
        <p>{{ updatedLabel(state.updatedAt) }}</p>
    </header>

    <input #fileInput hidden type="file" accept="application/pdf,.pdf" (change)="onSelectFile($event)">

    <div class="pages" *ngIf="state.pages.length; else noPages">
        <button class="page" type="button" (click)="onOpen(page)" *ngFor="let page of state.pages; let i = index">
            <img [src]="page" [alt]="'Pagina ' + (i + 1)">
            <span>Pagina {{ i + 1 }}</span>
        </button>
    </div>

    <ng-template #noPages>
        <div class="empty-state">
            <mat-icon>menu_book</mat-icon>
            <strong>Nicio ediție încărcată</strong>
            <span>Alege primul PDF pentru a genera paginile.</span>
        </div>
    </ng-template>

    <section class="selected-edition" *ngIf="pendingFile as file">
        <div class="selected-file">
            <mat-icon>picture_as_pdf</mat-icon>
            <div>
                <strong>{{ file.name }}</strong>
                <span>{{ fileSize(file) }} · vor fi publicate primele 8 pagini</span>
            </div>
        </div>
        <div class="upload-actions">
            <button mat-button type="button" (click)="clearSelection()" [disabled]="uploading">Anulează</button>
            <button mat-raised-button color="primary" type="button" (click)="uploadSelected()" [disabled]="uploading">
                <mat-icon>{{ uploading ? 'hourglass_top' : 'published_with_changes' }}</mat-icon>
                {{ uploading ? 'Se procesează…' : 'Înlocuiește ediția' }}
            </button>
        </div>
    </section>

    <footer class="edition__footer">
        <button mat-raised-button color="primary" (click)="fileInput.click()" [disabled]="uploading">
            <mat-icon>upload_file</mat-icon>
            Actualizează ediția
        </button>
    </footer>
</section>
