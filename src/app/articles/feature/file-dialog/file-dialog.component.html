<div class="container"
    *ngIf="files$ | async as files"
    [class.container--dragging]="dragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)">
    <div class="drop-message" *ngIf="dragging">
        <mat-icon>cloud_upload</mat-icon>
        <strong>Lasă fișierele aici</strong>
    </div>
    <header>
        <div>
            <h2>Alege o imagine</h2>
            <p>Trage fișiere aici, lipește cu Ctrl+V sau selectează-le din calculator.</p>
        </div>
        <div class="actions">
            <input (change)="onUploadFile($event)" type="file" multiple style="display: none;" #fileInput>
            <button type="button" (click)="fileInput.click()" mat-stroked-button color="primary" [disabled]="uploading">
                <mat-icon>upload</mat-icon>Încarcă
            </button>
            <button type="button" [mat-dialog-close]="files[selected].imageUrl" mat-raised-button color="primary" *ngIf="selected != undefined" [disabled]="uploading">
                <mat-icon>done</mat-icon>Alege
            </button>
            <button type="button" (click)="close()" mat-icon-button aria-label="Închide"><mat-icon>close</mat-icon></button>
        </div>
    </header>
    <div class="upload-progress" *ngIf="uploading">
        <div><span>Se încarcă {{ uploadCount === 1 ? 'fișierul' : uploadCount + ' fișiere' }}…</span><strong>{{ uploadProgress }}%</strong></div>
        <mat-progress-bar mode="determinate" [value]="uploadProgress"></mat-progress-bar>
    </div>
    <div class="files">
        <img class="file" [class.file--selected]="i == selected" (click)="onSelect(i)" [src]="file.pdf ? pdfImageUrl : file.imageUrl" [alt]="file.name" *ngFor="let file of files; let i = index">
    </div>
    <div class="empty-state" *ngIf="!files.length"><mat-icon>image</mat-icon><span>Încarcă prima imagine prin drag & drop sau Ctrl+V.</span></div>
</div>
